<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
body {
  background: #080808;
  overflow: hidden;
}

.loader-wrapper {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
}

.loader {
  position: relative;
  animation: speeder 0.4s linear infinite;
}

/* Iron Man Body */
.loader > span {
  height: 5px;
  width: 35px;
  background: #C0152A; /* Red suit */
  position: absolute;
  top: -19px;
  left: 60px;
  border-radius: 2px 10px 1px 0;
}

/* Thruster flame */
.loader > span:after {
  content: "";
  position: absolute;
  left: -20px;
  top: 1px;
  width: 20px;
  height: 3px;
  background: #00E5FF;
  box-shadow: 0 0 8px #00E5FF, 0 0 15px #00E5FF;
  border-radius: 50%;
  animation: thruster 0.1s linear infinite alternate;
}

/* Base Body borders */
.base span {
  position: absolute;
  width: 0;
  height: 0;
  border-top: 6px solid transparent;
  border-right: 100px solid #C0152A; /* Red */
  border-bottom: 6px solid transparent;
}

/* Head */
.base span:before {
  content: "";
  height: 22px;
  width: 22px;
  border-radius: 50%;
  background: #C0152A; /* Red head */
  position: absolute;
  right: -110px;
  top: -16px;
}

/* Arm / Shoulder */
.base span:after {
  content: "";
  position: absolute;
  width: 0;
  height: 0;
  border-top: 0 solid transparent;
  border-right: 55px solid #8B0000; /* Darker red */
  border-bottom: 16px solid transparent;
  top: -16px;
  right: -98px;
}

/* Faceplate */
.face {
  position: absolute;
  height: 12px;
  width: 20px;
  background: #D4A017; /* Gold */
  border-radius: 20px 20px 0 0;
  transform: rotate(-40deg);
  right: -125px;
  top: -15px;
  box-shadow: inset -2px 0 5px rgba(0,0,0,0.3);
}

/* Eye Glow */
.face:after {
  content: "";
  height: 4px;
  width: 8px;
  background: #00FFFF; /* Blue eye */
  box-shadow: 0 0 5px #00FFFF, 0 0 10px #00FFFF;
  right: 4px;
  top: 5px;
  position: absolute;
  transform: rotate(40deg);
  transform-origin: 50% 50%;
  border-radius: 2px;
}

/* Speed lines from the back */
.loader > span > span:nth-child(1),
.loader > span > span:nth-child(2),
.loader > span > span:nth-child(3),
.loader > span > span:nth-child(4) {
  width: 30px;
  height: 1px;
  background: rgba(255,255,255,0.4);
  position: absolute;
  animation: fazer1 0.2s linear infinite;
}
.loader > span > span:nth-child(2) {
  top: 3px;
  animation: fazer2 0.4s linear infinite;
}
.loader > span > span:nth-child(3) {
  top: 1px;
  animation: fazer3 0.4s linear infinite;
  animation-delay: -1s;
}
.loader > span > span:nth-child(4) {
  top: 4px;
  animation: fazer4 1s linear infinite;
  animation-delay: -1s;
}

@keyframes fazer1 { 0% { left: 0; } 100% { left: -80px; opacity: 0; } }
@keyframes fazer2 { 0% { left: 0; } 100% { left: -100px; opacity: 0; } }
@keyframes fazer3 { 0% { left: 0; } 100% { left: -50px; opacity: 0; } }
@keyframes fazer4 { 0% { left: 0; } 100% { left: -150px; opacity: 0; } }

@keyframes speeder {
  0% { transform: translate(2px, 1px) rotate(0deg); }
  10% { transform: translate(-1px, -3px) rotate(-1deg); }
  20% { transform: translate(-2px, 0px) rotate(1deg); }
  30% { transform: translate(1px, 2px) rotate(0deg); }
  40% { transform: translate(1px, -1px) rotate(1deg); }
  50% { transform: translate(-1px, 3px) rotate(-1deg); }
  60% { transform: translate(-1px, 1px) rotate(0deg); }
  70% { transform: translate(3px, 1px) rotate(-1deg); }
  80% { transform: translate(-2px, -1px) rotate(1deg); }
  90% { transform: translate(2px, 1px) rotate(0deg); }
  100% { transform: translate(1px, -2px) rotate(-1deg); }
}

@keyframes thruster {
  0% { transform: scaleX(1); opacity: 0.7; }
  100% { transform: scaleX(1.6); opacity: 1; }
}

/* Longfazers (environment speed lines) */
.longfazers {
  position: absolute;
  width: 100%;
  height: 100%;
}
.longfazers span {
  position: absolute;
  height: 1px;
  width: 20%;
  background: rgba(255,255,255,0.2);
  box-shadow: 0 0 5px rgba(255,255,255,0.1);
}
.longfazers span:nth-child(1) { top: 20%; animation: lf 0.6s linear infinite; animation-delay: -5s; }
.longfazers span:nth-child(2) { top: 40%; animation: lf2 0.8s linear infinite; animation-delay: -1s; }
.longfazers span:nth-child(3) { top: 60%; animation: lf3 0.6s linear infinite; }
.longfazers span:nth-child(4) { top: 80%; animation: lf4 0.5s linear infinite; animation-delay: -3s; }

@keyframes lf { 0% { left: 200%; } 100% { left: -200%; opacity: 0; } }
@keyframes lf2 { 0% { left: 200%; } 100% { left: -200%; opacity: 0; } }
@keyframes lf3 { 0% { left: 200%; } 100% { left: -100%; opacity: 0; } }
@keyframes lf4 { 0% { left: 200%; } 100% { left: -100%; opacity: 0; } }
</style>
</head>
<body>

<div class="longfazers">
  <span></span><span></span><span></span><span></span>
</div>
<div class="loader-wrapper">
  <div class="loader">
    <span><span></span><span></span><span></span><span></span></span>
    <div class="base">
      <span></span>
      <div class="face"></div>
    </div>
  </div>
</div>

</body>
</html>
